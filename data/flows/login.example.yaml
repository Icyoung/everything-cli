name: login
description: Login and save session token.

inputs:
  email:
    prompt: Email
    type: string
    required: true
  password:
    prompt: Password
    type: password
    required: true
  code:
    prompt: Email code
    type: string
    required: false
    default: ""
  googleCode:
    prompt: Google OTP
    type: string
    required: false
    default: ""

inputGroups:
  anyOf:
    - fields:
        - code
        - googleCode
      prompt: Enter either an email code or Google OTP.
      message: email code or Google OTP

steps:
  - id: login
    call: auth.login
    body:
      email: "{{inputs.email}}"
      password: "{{inputs.password}}"
      code: "{{inputs.code}}"
      googleCode: "{{inputs.googleCode}}"

save:
  cache:
    token: "{{steps.login.response.data.token}}"
    user: "{{steps.login.response.data.user}}"
  required:
    - cache.token
